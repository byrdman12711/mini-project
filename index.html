<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mini-project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section>
        <nav>
            <div class="logo">
              <img src="./assets/fes-logo.png" alt="frontend simplified logo" class="logo__img" width="50">
              <h1 class="logo__text"><b>Frontend</b> Simplified</h1>
            </div>
            <ul>
                <li>
                    <a href="about">About</a>
                    <a href="social">Social</a>
                    <a href="contact">Contact Us</a>
                </li>
            </ul>
        </nav>


        <header>
            <div class="row">
                <div class="course">
                    <h1 class="course__icon"> 💾</h1>
                    <div class="course__text">
                        <div class="course__selection">----Your Course</div>
                        <div class="course__title">Software Engineering</div>

                    </div>
                </div>
            </div>

            <div class="row">
                <div class="hero">
                    <figure class="hero__img--wrapper">
                        <img src="/assets/laptop.png" alt="Laptop">
                    </figure>
                   <div class="hero__description">
                    <h1>
                        Best place to learn frontend.
                    </h1>
                    <p class="subheader">
                        Go from a beginner to a professional frontend developer with a simplified process. 
                    </p>
                    <a href="about">
                        <button class="hero__description--button">
                            ▷
                        </button>
                    </a>
                   </div> 
                </div>
            </div>
        </header>

    </section>
</body> 
</html>
